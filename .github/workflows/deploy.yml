
name: LocalDocs CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI: Build and validate the application on GitHub's runner.
  ci:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend Python syntax
        working-directory: backend
        run: python -m compileall -q app

  # CD: Deploy only after CI succeeds, and only from main.
  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Deploy LocalDocs
        run: |
          set -eu

          cd "$HOME/localdocs"

          git pull --ff-only origin main

          docker compose config -q
          docker compose up -d --build --scale backend=3

      - name: Check API health
        run: |
          set -eu
          cd "$HOME/localdocs"
      
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error 
              http://127.0.0.1/api/health; then
              echo "API health check passed"
              exit 0
            fi
      
            echo "Waiting for API to become healthy... ($i/12)"
            sleep 5
          done
      
          echo "API health check failed"
          docker compose ps
          docker compose logs --tail=100 frontend backend
          exit 1
