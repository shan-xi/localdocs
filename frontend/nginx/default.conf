# Define rate limit zone (http context)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Define backend load-balancing pool (http context)
upstream backend_pool {
    least_conn;
    server localdocs-backend-1:8000;
    server localdocs-backend-2:8000;
    server localdocs-backend-3:8000;
}

server {
    listen 80;
    server_name _;

    # Maximum upload file size
    client_max_body_size 10M;

    # React application
    root /usr/share/nginx/html;
    index index.html;

    # React client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI backend
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # Forward requests to the backend pool
        proxy_pass http://backend_pool/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}